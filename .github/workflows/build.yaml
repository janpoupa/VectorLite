name: Build Windows Release

on:
  workflow_dispatch: # This allows you to click a "Run" button in GitHub

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # This gives the action permission to create a Release
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "VectorLite Windows Build"
          releaseBody: "Automated cloud build of VectorLite."
          releaseDraft: true # Keeps the release private until you publish it
          prerelease: false