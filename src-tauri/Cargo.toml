[package]
name = "vectorlite"
version = "0.1.0"
description = "VectorLite — Fast, lightweight native vector viewer"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vectorlite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.16"

# SVG rasterization for export
resvg = "0.44"
tiny-skia = "0.11"

# Image encoding & decoding (PNG, JPEG, WebP, and TIFF for EPS preview decoding)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
